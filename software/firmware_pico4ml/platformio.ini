; PersonaSticker 簡素版 — Arducam Pico4ML-BLE(RP2040)で 1 台だけ動かす
;
;   pio run                 ビルド
;   pio run -t upload       BOOTSEL(RPI-RP2)へ書き込み
;   pio device monitor      USB シリアル(1 秒に 1 行の JSON、コマンドは README)
;
; 感情エンジン(lib/emotion_core)は ESP32 版・シミュレーター・テストと同じものを ../firmware/lib から使う。
; 書き直したのはセンサー・液晶・ループだけ(src/)。
[env:pico4ml]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
; カメラの XCLK = sysclk / 8 = 25 MHz(firmware/tools/pico4ml_irball と同じ)
board_build.f_cpu = 200000000L
lib_extra_dirs = ../firmware/lib
lib_deps = emotion_core
build_flags = -O2 -std=gnu++17 -Wl,-u,_printf_float
build_unflags = -Os -std=gnu++11 -std=gnu++14
build_src_flags = -Wall -Wextra
monitor_speed = 115200
upload_protocol = picotool
