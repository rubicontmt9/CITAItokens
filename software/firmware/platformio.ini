; PersonaSticker ファームウェア
;   env:node    — 電池駆動ノード(通常のステッカー)
;   env:gateway — ゲートウェイ(USB常時給電・メッシュルート・Web UI)
;   env:native  — 共有コア(emotion_core)のPCユニットテスト
;
; ビルド:   pio run -e node / pio run -e gateway
; 書き込み: pio run -e node -t upload
; Web UI:  pio run -e gateway -t uploadfs  (data/ を LittleFS へ)
; テスト:   pio test -e native

[platformio]
default_envs = node

[esp32common]
platform = espressif32@6.9.0
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
; 共有コア・ゲートウェイコードがC++17を使うため標準を上げる
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_USE_LONG_LONG=0
build_unflags =
    -std=gnu++11
lib_deps =
    painlessmesh/painlessMesh @ ^1.5.4
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit LIS3DH @ ^1.3.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    zinggjm/GxEPD2 @ ^1.6.2
    esp32async/ESPAsyncWebServer @ ^3.7.0
    esp32async/AsyncTCP @ ^3.3.8

[env:node]
platform = ${esp32common.platform}
framework = ${esp32common.framework}
board = ${esp32common.board}
monitor_speed = ${esp32common.monitor_speed}
lib_deps = ${esp32common.lib_deps}
build_unflags = ${esp32common.build_unflags}
board_build.filesystem = littlefs
build_flags = ${esp32common.build_flags} -DROLE_NODE

[env:gateway]
platform = ${esp32common.platform}
framework = ${esp32common.framework}
board = ${esp32common.board}
monitor_speed = ${esp32common.monitor_speed}
lib_deps = ${esp32common.lib_deps}
build_unflags = ${esp32common.build_unflags}
board_build.filesystem = littlefs
build_flags = ${esp32common.build_flags} -DROLE_GATEWAY

; 共有コアのユニットテスト(PC上で実行、Arduino非依存)
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
